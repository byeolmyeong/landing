<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<!-- 링크 미리보기 이미지(public/og.png, 1200×630)의 원본 — 비교 시안 A안(별이 가운데, 소유자 2026-11-20).
     고치면 README "공유 이미지" 의 명령으로 다시 찍는다. 배포에는 포함하지 않는다(.vercelignore).
     카카오톡 목록처럼 가운데를 정사각형으로 잘라도 보이게 별이 · 문구 · 로고를 모두 가운데 세로로 쌓는다 -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #0D0E12; }
  body { position: relative; font-family: "Pretendard", "Apple SD Gothic Neo", sans-serif; color: #F2F3F7; word-break: keep-all; }
  .glow { position: absolute; width: 820px; height: 820px; left: 190px; top: -230px; border-radius: 50%; background: radial-gradient(circle, rgba(71, 82, 255, .5) 0%, rgba(71, 82, 255, 0) 70%); }
  .specks i { position: absolute; width: 3px; height: 3px; border-radius: 2px; background: #F4F7FF; }
  .stack { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  .byeoli { width: 210px; height: 210px; }
  h1 { margin: 18px 0 0; font-size: 54px; line-height: 68px; font-weight: 600; letter-spacing: -0.03em; }
  .logo { margin-top: 26px; display: inline-flex; align-items: center; gap: 12px; font-size: 28px; font-weight: 600; letter-spacing: -0.02em; color: #C8CAD3; }
  .logo img { width: 36px; height: 36px; }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="specks"><i style="left:120px;top:90px;opacity:.5"></i><i style="left:1060px;top:120px;opacity:.4"></i><i style="left:980px;top:520px;opacity:.35"></i><i style="left:210px;top:500px;opacity:.4"></i><i style="left:640px;top:60px;opacity:.3;width:2px;height:2px"></i></div>
  <div class="stack">
    <img class="byeoli" src="../public/brand/byeoli.svg" alt="">
    <h1>점성술을 몰라도<br>읽히는 나의 별명</h1>
    <span class="logo"><img src="../public/brand/byeoli.svg" alt="">별명</span>
  </div>
</body>
</html>
